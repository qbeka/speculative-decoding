[project]
name = "specdec"
version = "0.1.0"
description = "A local speculative decoding engine with a cost-based block length controller."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.15.0",
  "transformers==5.22.1",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
specdec = "specdec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specdec"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs downloaded model weights (skipped when they are absent)"]
